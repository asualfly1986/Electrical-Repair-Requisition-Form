<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <!-- PEA Circular Emblem -->
  <g transform="translate(60, 60)">
    <!-- Outer gold/purple ring -->
    <circle cx="0" cy="0" r="54" fill="#6A1B9A" stroke="#F5A623" stroke-width="4"/>
    <circle cx="0" cy="0" r="46" fill="#7B1FA2" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="38" fill="#F3E5F5"/>
    
    <!-- Thai Traditional Graphic Elements & Lightning Bolts -->
    <!-- Center symbol representing electrical power and royal crest emblem -->
    <path d="M0 -32 L6 -10 L28 -10 L10 4 L18 26 L0 12 L-18 26 L-10 4 L-28 -10 L-6 -10 Z" fill="#D4AF37" stroke="#8E6516" stroke-width="1"/>
    <!-- Center electrical core -->
    <circle cx="0" cy="0" r="14" fill="#4A148C" stroke="#F5A623" stroke-width="2"/>
    <!-- Lightning bolt inside -->
    <path d="M2 -10 L-6 1 L1 1 L-3 10 L6 -1 L-1 -1 Z" fill="#FFEB3B"/>
    <!-- Small dots around ring -->
    <circle cx="0" cy="-42" r="2.5" fill="#FFFFFF"/>
    <circle cx="21" cy="-36" r="2.5" fill="#FFFFFF"/>
    <circle cx="36" cy="-21" r="2.5" fill="#FFFFFF"/>
    <circle cx="42" cy="0" r="2.5" fill="#FFFFFF"/>
    <circle cx="36" cy="21" r="2.5" fill="#FFFFFF"/>
    <circle cx="21" cy="36" r="2.5" fill="#FFFFFF"/>
    <circle cx="0" cy="42" r="2.5" fill="#FFFFFF"/>
    <circle cx="-21" cy="36" r="2.5" fill="#FFFFFF"/>
    <circle cx="-36" cy="21" r="2.5" fill="#FFFFFF"/>
    <circle cx="-42" cy="0" r="2.5" fill="#FFFFFF"/>
    <circle cx="-36" cy="-21" r="2.5" fill="#FFFFFF"/>
    <circle cx="-21" cy="-36" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- Typography: การไฟฟ้าส่วนภูมิภาค / PROVINCIAL ELECTRICITY AUTHORITY -->
  <text x="135" y="58" font-family="'Sarabun', 'Prompt', 'Noto Sans Thai', 'TH Sarabun New', sans-serif" font-size="28" font-weight="700" fill="#4A148C" letter-spacing="0.5">การไฟฟ้าส่วนภูมิภาค</text>
  <text x="136" y="82" font-family="'Inter', 'Arial', sans-serif" font-size="11" font-weight="700" fill="#5E35B1" letter-spacing="1.8">PROVINCIAL ELECTRICITY AUTHORITY</text>
</svg>
