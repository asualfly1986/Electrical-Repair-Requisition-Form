<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D1F6E"/>
      <stop offset="50%" stop-color="#241148"/>
      <stop offset="100%" stop-color="#140728"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#FFB627"/>
      <stop offset="100%" stop-color="#E68A00"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6F42C1"/>
      <stop offset="100%" stop-color="#4B208C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FFB627" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative circles -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#5B32A3" stroke-width="3" opacity="0.35"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#FFB627" stroke-width="2" stroke-dasharray="8 8" opacity="0.4"/>
  
  <!-- Inner Shield / Wallet Symbol -->
  <path d="M140 180 C140 150 165 130 200 130 L312 130 C347 130 372 150 372 180 L372 330 C372 375 330 400 256 400 C182 400 140 375 140 330 Z" fill="url(#shieldGrad)" opacity="0.85"/>
  
  <!-- PEA Gold Lightning Bolt -->
  <polygon points="275,100 185,260 250,260 230,410 335,230 270,230" fill="url(#goldGrad)" filter="url(#glow)"/>
  
  <!-- Small Coin Accent -->
  <circle cx="360" cy="165" r="28" fill="url(#goldGrad)"/>
  <text x="360" y="174" font-size="24" font-weight="900" font-family="'Arial', sans-serif" fill="#241148" text-anchor="middle">฿</text>
</svg>
